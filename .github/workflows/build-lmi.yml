name: Build Kernel lmi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 unzip

      - name: Download Proton Clang
        run: |
          mkdir -p $HOME/proton-clang
          cd $HOME/proton-clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip

      - name: Build kernel for lmi (with KernelSU)
        run: |
          bash build.sh lmi

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lmi-output
          path: "**/Kernel_*.zip"
